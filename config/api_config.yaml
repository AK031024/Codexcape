openai:
  api_key: "${OPENAI_API_KEY}"
  model: "gpt-3.5-turbo"
  max_tokens: 500
  temperature: 0.7

app:
  secret_key: "storyweaver-secret-2024"
  debug: true
  host: "0.0.0.0"
  port: 5000

database:
  path: "instance/carbonhero.db"
  timeout: 30

ai_settings:
  max_writing_samples: 5
  voice_analysis_depth: "medium"
  genre_support:
    - "fantasy"
    - "sci-fi"
    - "mystery"
    - "romance"
    - "thriller"
    - "historical"